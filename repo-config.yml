# yaml-language-server: $schema=./schemas/repo-config/v2.schema.json
# Rhino's own grouped-v2 policy. The generated schema and this source stay in
# one repository, so the editor modeline is local rather than a release URL.

schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - node_modules
    - target
    - local-tmp
    - worktrees

harness:
  canonical:
    agents:
      name: name
      description: description
      tier: tier
      grants: requires
      denials: denies
      constraints: constraints
    skills:
      name: name
      description: description
  requirements:
    capabilities:
      - repository-read
      - repository-write
      - shell
    constraints:
      - inline-result-only
    routes:
      - canonical-import
    identities:
      - description
  profiles:
    - id: claude
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
        constraints:
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      instruction-adapter:
        path: CLAUDE.md
        route: "@{path}"
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        tier-fields: { model: model, effort: effort }
        translations:
          - { when: always, field: tools, members: [Read] }
          - {
              when: requires,
              capability: repository-read,
              field: tools,
              members: [Glob, Grep],
            }
          - {
              when: requires,
              capability: repository-write,
              field: tools,
              members: [Write, Edit],
            }
          - { when: requires, capability: shell, field: tools, members: [Bash] }
          - {
              when: denies,
              capability: repository-write,
              field: tools,
              absent-members: [Write, Edit],
            }
          - {
              when: denies,
              capability: shell,
              field: tools,
              absent-members: [Bash, PowerShell],
            }
          - {
              when: denies,
              capability: nested-agent,
              field: tools,
              absent-members: [Agent, Task],
            }
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        route: "Read {path} completely, resolve every relative resource from that skill directory, and follow it as authoritative before acting."
        identity: { name: name, description: description }
      tiers:
        plan: { model: opus, effort: high }
    - id: codex
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
        constraints:
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        absent: [model, effort]
    - id: opencode
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
        constraints:
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { description: description }
        fixed: { mode: subagent }
        translations:
          - { when: always, field: permission, entries: { read: allow } }
          - {
              when: requires,
              capability: repository-read,
              field: permission,
              entries: { glob: allow, grep: allow },
            }
          - {
              when: requires,
              capability: repository-write,
              field: permission,
              entries: { edit: allow },
            }
          - {
              when: requires,
              capability: shell,
              field: permission,
              entries: { bash: allow },
            }
          - {
              when: denies,
              capability: repository-write,
              field: permission,
              entries: { edit: deny },
            }
          - {
              when: denies,
              capability: shell,
              field: permission,
              entries: { bash: deny },
            }
          - {
              when: denies,
              capability: nested-agent,
              field: permission,
              entries: { task: deny },
            }

policies:
  markdown:
    heading-hierarchy:
      surfaces:
        - glob: "repo-governance/**/*.md"
        - glob: "docs/**/*.md"
      single-h1: true
      max-level-jump: 1
    internal-link:
      exclude-sources:
        - "plans/done/**"
    mermaid:
      node-label-graphemes: 32
      edge-label-graphemes: 24
      fill-colors: ["#0173B2", "#DE8F05", "#029E73", "#CA9161"]
      edge-colors: ["#0173B2", "#000000"]
      text-colors: ["#000000", "#FFFFFF"]
    naming:
      surfaces:
        - { glob: "repo-governance/**/*.md", style: kebab-case }
        - { glob: "docs/**/*.md", style: kebab-case }
        - { glob: "plans/**/*.md", style: kebab-case }
      exempt: ["**/README.md"]
  governance:
    word-budget:
      count: letters-and-digits
      surfaces:
        - { glob: "AGENTS.md", fail: 650, warn: 550 }
        - { glob: "README.md", fail: 2100, warn: 2000 }
        - { glob: "repo-governance/**/*.md", fail: 750, warn: 650 }
    directory-map:
      trees:
        - { path: docs }
        - { path: plans }
        - { path: repo-governance }
        - { path: specs }
  conventions:
    emoji:
      prohibited:
        - { glob: "**/*.json" }
        - { glob: "**/*.toml" }
        - { glob: "**/*.yml" }

gates:
  composition:
    pull-request: { relation: at-least }
  entries:
    - id: public-safety-tree
      type: check
      command:
        executable: bash
        args:
          - { literal: scripts/public-safety/check.sh }
      run-on:
        pre-commit: {}
        pre-push: {}
        pull-request: {}
    - id: public-safety-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: bash
        args:
          - { literal: scripts/public-safety/check-commit-message.sh }
        environment:
          RHINO_GATE_MESSAGE: { input: message.text }
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: commit-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: bash
        args:
          - { literal: scripts/check-commit-message.sh }
        environment:
          RHINO_GATE_MESSAGE: { input: message.text }
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: commit-history
      type: check
      inputs:
        range: { kind: commit-range }
      command:
        executable: bash
        args:
          - { literal: scripts/check-commit-range.sh }
          - { input: range.base, expand: single }
          - { input: range.head, expand: single }
      run-on:
        pull-request:
          reason: "Commitlint must receive each immutable commit separately, rather than one concatenated message stream."
          bind:
            range: { source: explicit-range, range: explicit }
    - id: format-staged
      type: mutation
      inputs:
        staged: { kind: files }
      mutation: { local: apply-index, ci: verify-clean }
      command:
        executable: bash
        args:
          - { literal: scripts/format-staged.sh }
          - { input: staged.paths, expand: repeat }
      run-on:
        pre-commit:
          bind:
            staged: { source: git-index }
        pull-request:
          bind:
            staged: { source: explicit-range, range: explicit }
    - id: quick
      type: check
      command:
        executable: ./hippo
        args:
          - { literal: run }
          - { literal: --class }
          - { literal: ephemeral }
          - { literal: --resource-tier }
          - { literal: heavy }
          - { literal: --disk-path }
          - { literal: . }
          - { literal: -- }
          - { literal: cargo }
          - { literal: xtask }
          - { literal: test-quick }
      run-on:
        pre-push: {}
        pull-request: {}
    - id: public-safety-tests
      type: check
      command:
        executable: bash
        args:
          - { literal: scripts/public-safety/tests/run.sh }
      run-on:
        pull-request:
          reason: "The scanner regression suite needs an isolated checkout rather than a local hook."
    - id: repo-config
      type: check
      command:
        {
          executable: cargo,
          args:
            [
              { literal: run },
              { literal: --quiet },
              { literal: --bin },
              { literal: rhino },
              { literal: -- },
              { literal: repo-config },
              { literal: validate },
            ],
        }
      run-on: { pre-push: {}, pull-request: {} }
    - id: word-budget
      type: check
      command:
        {
          executable: cargo,
          args:
            [
              { literal: run },
              { literal: --quiet },
              { literal: --bin },
              { literal: rhino },
              { literal: -- },
              { literal: governance },
              { literal: word-budget },
              { literal: validate },
            ],
        }
      run-on: { pre-push: {}, pull-request: {} }
    - id: directory-map
      type: check
      command:
        {
          executable: cargo,
          args:
            [
              { literal: run },
              { literal: --quiet },
              { literal: --bin },
              { literal: rhino },
              { literal: -- },
              { literal: governance },
              { literal: directory-map },
              { literal: validate },
            ],
        }
      run-on: { pre-push: {}, pull-request: {} }
    - id: harness-adapters
      type: check
      command:
        {
          executable: cargo,
          args:
            [
              { literal: run },
              { literal: --quiet },
              { literal: --bin },
              { literal: rhino },
              { literal: -- },
              { literal: harness },
              { literal: adapters },
              { literal: validate },
            ],
        }
      run-on: { pre-push: {}, pull-request: {} }
    - id: internal-link
      type: check
      command:
        {
          executable: cargo,
          args:
            [
              { literal: run },
              { literal: --quiet },
              { literal: --bin },
              { literal: rhino },
              { literal: -- },
              { literal: md },
              { literal: internal-link },
              { literal: validate },
            ],
        }
      run-on: { pre-push: {}, pull-request: {} }
    - id: mermaid
      type: check
      command:
        {
          executable: cargo,
          args:
            [
              { literal: run },
              { literal: --quiet },
              { literal: --bin },
              { literal: rhino },
              { literal: -- },
              { literal: md },
              { literal: mermaid },
              { literal: validate },
            ],
        }
      run-on: { pre-push: {}, pull-request: {} }
    - id: md-naming
      type: check
      command:
        {
          executable: cargo,
          args:
            [
              { literal: run },
              { literal: --quiet },
              { literal: --bin },
              { literal: rhino },
              { literal: -- },
              { literal: md },
              { literal: naming },
              { literal: validate },
            ],
        }
      run-on: { pre-push: {}, pull-request: {} }
    - id: heading-hierarchy
      type: check
      command:
        {
          executable: cargo,
          args:
            [
              { literal: run },
              { literal: --quiet },
              { literal: --bin },
              { literal: rhino },
              { literal: -- },
              { literal: md },
              { literal: heading-hierarchy },
              { literal: validate },
            ],
        }
      run-on: { pre-push: {}, pull-request: {} }
    - id: convention-emoji
      type: check
      command:
        {
          executable: cargo,
          args:
            [
              { literal: run },
              { literal: --quiet },
              { literal: --bin },
              { literal: rhino },
              { literal: -- },
              { literal: convention },
              { literal: emoji },
              { literal: validate },
            ],
        }
      run-on: { pre-push: {}, pull-request: {} }

extensions:
  # Owner: repo-governance/development/quality/stacks/repository-adapter.md
  software-development:
    projects:
      rhino:
        path: .
        kind: app
        stacks: [rust]
      xtask:
        path: xtask
        kind: tooling
        stacks: [rust]
      repo-scripts:
        path: scripts
        kind: tooling
        stacks: [shell]
      public-safety:
        path: scripts/public-safety
        kind: tooling
        stacks: [shell]

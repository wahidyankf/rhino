# Repository configuration -- ose/repo-config/v2
#
# RHINO's own policy: what this repository requires of itself, and what must
# pass before a change lands. Every value below is a choice this repository
# made; the tool ships none of them.
#
# Every validator section is unchanged from the v1 file this replaces. Those
# rules did not stop being true because the schema did, and a migration that
# also moved a budget would make the two incomparable. What v2 adds is the two
# things v1 could only imply: who may read this repository, and which checks run
# at which moment.
#
# The second was the sharper gap here. RHINO shipped this schema and its gate
# dispatch in v0.3.0, and its three consumers moved onto it, while the tool
# itself kept its own registry as a nine-entry array in `xtask/src/main.rs` and
# three hand-written hook sequences. That is four places to look and four places
# to forget, in the one repository that has no excuse for it.
#
# The key order is fixed by v2 rather than chosen here, so a reader comparing two
# repositories' configurations compares like with like.

schema: ose/repo-config/v2

# Public, and gated as public. The repository, its history, and its Actions logs
# are readable by anyone, so the safety gate below is first on every surface
# rather than last on one of them.
visibility: public

# One mapping, because one agent declares a tier. `plan` is the tier the plan
# agents carry; the other three tiers are undeclared because no agent here
# claims them, and a mapping for a tier nobody uses would be a promise nothing
# tests. An agent whose tier has no mapping keeps the harness default, which is
# the behaviour the adapter contract requires rather than a gap in this file.
model-tiers:
  claude:
    plan:
      model: opus
      effort: high

scan:
  # Directory names, matched at any depth. `worktrees` and `local-tmp` are not
  # optional conveniences: RHINO walks the filesystem rather than the index, so
  # a git-ignored directory is still read. An in-repository worktree is a whole
  # second copy of this tree, and leaving it in doubles every counted document,
  # every resolved link and every mapped directory -- and reports the copy's own
  # CLAUDE.md as a second always-on instruction source.
  exclude-directories:
    - .git
    - node_modules
    - target
    - local-tmp
    - worktrees
    # The shared plan-structure fixture corpus. Excluded because its bytes are
    # the boundary two implementations agree on: every case is deliberately
    # malformed in exactly one way, and holding it to this repository's own
    # naming, heading, and directory-map rules would either report those
    # defects as findings or pressure someone to reformat bytes another
    # repository verifies by digest.
    - fixtures

harness-parity:
  canonical:
    instruction: AGENTS.md
    instruction-adapter: CLAUDE.md
    skills-root: .agents/skills
    skill-route: "Read {path} completely, resolve every relative resource from that skill directory, and follow it as authoritative before acting."
    agents-root: .agents/agents
    agent-route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
    # The names are this repository's own. A list read under a name nobody
    # wrote comes back empty rather than missing, so a validator that chose
    # these itself would find no capabilities, fire no translation, and report
    # a clean repository -- the one kind of defect a gate cannot survive.
    declaration:
      grants: requires
      denials: denies
      limits: constraints
      fixed: { mode: subagent }
  harnesses:
    # Codex and OpenCode both read `.agents/skills/` natively, so the canon is
    # already their surface and a skill adapter would be a second copy of a
    # file they were going to read anyway. Claude Code reads only
    # `.claude/skills/`, so it is the one harness that needs a route. That
    # asymmetry is the honest declaration; the schema permits it, and the
    # alternative -- an adapter pointing at a directory the vendor does not
    # read -- would be a parity claim that reconciles nothing.
    - name: claude
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        identity: { name: name, description: description }
        # A wrapper declares its identity and the route. Nothing else: an
        # adapter that could add front matter could add an instruction.
        closed: true
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        identity: { name: name, description: description }
        translations:
          - { when: always, field: tools, members: [Read] }
          - when: requires
            capability: repository-read
            field: tools
            members: [Glob, Grep]
          # An agent that authors plans needs to write them, and one that runs
          # a gate needs a shell. Neither had a translation here, because no
          # agent declared them; the first that did would have been generated
          # without the tools its own definition grants.
          - when: requires
            capability: repository-write
            field: tools
            members: [Write, Edit]
          - when: requires
            capability: shell
            field: tools
            members: [Bash]
          - when: denies
            capability: repository-write
            field: tools
            absent-members: [Write, Edit]
          - when: denies
            capability: shell
            field: tools
            absent-members: [Bash, PowerShell]
          - when: denies
            capability: nested-agent
            field: tools
            absent-members: [Agent, Task]
    - name: codex
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        identity: { name: name, description: description }
        # Codex expresses the whole boundary in one field, so the field is
        # translated rather than pinned. It was pinned to `read-only` while
        # every agent here was read-only; a value fixed for every agent claims
        # read-only for one that writes. A portable adapter may still not pin
        # a model, which `absent` keeps true.
        translations:
          - when: denies
            capability: repository-write
            field: sandbox_mode
            members:
              - read-only
          - when: requires
            capability: repository-write
            field: sandbox_mode
            members:
              - workspace-write
        absent: [model]
    - name: opencode
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        identity: { description: description }
        fixed: { mode: subagent }
        translations:
          - { when: always, field: permission, entries: { read: allow } }
          - when: requires
            capability: repository-read
            field: permission
            entries: { glob: allow, grep: allow }
          # The same gap the claude adapter had, in this vendor's syntax.
          - when: requires
            capability: repository-write
            field: permission
            entries: { edit: allow }
          - when: requires
            capability: shell
            field: permission
            entries: { bash: allow }
          - when: denies
            capability: repository-write
            field: permission
            entries: { edit: deny }
          - when: denies
            capability: shell
            field: permission
            entries: { bash: deny }
          - when: denies
            capability: nested-agent
            field: permission
            entries: { task: deny }
  # No `required-mcp` and no per-harness `capability`. This repository uses no
  # workspace task runner and needs no credential-free capability vector, and
  # the schema treats that absence as an answer rather than an omission.
  prohibited-instruction-sources:
    - "**/AGENTS.md"
    - "**/AGENTS.override.md"
    - "**/CLAUDE.md"
    - ".claude/rules/**/*.md"
    - "**/GEMINI.md"
    - "**/.cursorrules"
    - "**/.windsurfrules"
    - ".github/copilot-instructions.md"
  # A competing always-on instruction written into a harness's own settings is
  # the same violation as a second CLAUDE.md, in the vendor's syntax. Only
  # OpenCode's key is declared: Codex's equivalent was not established by
  # inspection, and a prohibition naming a key nobody confirmed would claim
  # coverage it does not have.
  prohibited-instruction-fields:
    - file: opencode.json
      format: json
      field: instructions
  capabilities:
    - repository-read
    - repository-write
    - shell
    - nested-agent
  constraints:
    - inline-result-only

governance-word-budget:
  # A word is a run of letters and digits, so Markdown syntax counts for
  # nothing and a URL counts as its parts.
  count: letters-and-digits
  # Ordered: the last matching glob wins, so a specific surface can override a
  # general tree.
  surfaces:
    # AGENTS.md is an index into repo-governance and states no rule of its own,
    # so it is budgeted as an index. Going over means a rule was written here
    # instead of in the tree.
    - glob: "AGENTS.md"
      fail: 650
      warn: 550
    # Raised for v0.2.0, which added five commands, and again for v0.3.0, which
    # added metadata validation, gate dispatch, three governance structure
    # commands, and plan-structure validation: the quick start has to name
    # every command the tool answers to,
    # so the ceiling follows the command count rather than the other way round. This is the one surface where that
    # is true; the governance ceiling below is never raised to fit a document.
    # The warning line is the previous release's ceiling, so passing where
    # v0.2.0 stopped is something the author is told rather than something that
    # happens quietly.
    - glob: "README.md"
      fail: 2100
      warn: 2000
    # The governance tree. 750 is a ceiling, not a target: a document that
    # outgrows it is split into documents with distinct reader tasks, and the
    # number is never raised to fit one.
    - glob: "repo-governance/**/*.md"
      fail: 750
      warn: 650

governance-directory-map:
  trees:
    - path: docs
    - path: plans
    - path: repo-governance
    - path: specs

md-heading-hierarchy:
  surfaces:
    - glob: "repo-governance/**/*.md"
    - glob: "docs/**/*.md"
  single-h1: true
  max-level-jump: 1

# Configuration and data files. Not `**/*.md`: this repository's README opens
# its sections with an emoji by convention, and nothing here should stop it.

md-internal-link:
  # Archived plans are excluded as link *sources* only; they stay valid link
  # targets. A completed plan deliberately describes the repository as it was
  # and may name paths that have since moved, so reporting its outward links
  # would make finishing a plan produce findings.
  exclude-sources:
    - "plans/done/**"

md-mermaid:
  node-label-graphemes: 32
  edge-label-graphemes: 24
  # Okabe-Ito, which stays distinguishable under the common colour vision
  # deficiencies. A diagram that only works in full colour is a diagram some
  # readers cannot read.
  fill-colors: ["#0173B2", "#DE8F05", "#029E73", "#CA9161"]
  edge-colors: ["#0173B2", "#000000"]
  text-colors: ["#000000", "#FFFFFF"]

# Optional since v0.2.0. Declared because these are rules this repository
# already follows and had no way to state; the two sections left undeclared are
# left undeclared on purpose, and the reasons are below.

md-naming:
  surfaces:
    - glob: "repo-governance/**/*.md"
      style: kebab-case
    - glob: "docs/**/*.md"
      style: kebab-case
    - glob: "plans/**/*.md"
      style: kebab-case
  # A README is named for what it is, not for what it says, and the ordinal
  # prefix convention for companion documents is already kebab-case.
  exempt:
    - "**/README.md"

convention-emoji:
  prohibited:
    - glob: "**/*.json"
    - glob: "**/*.toml"
    - glob: "**/*.yml"

# `metadata` is not declared. The schemas exist -- this repository implements
# them -- but nothing in this tree carries front matter, and declaring the
# section would oblige `description` and `when_to_use` on 59 governance
# documents that have never carried either. That is a policy decision about how
# this repository writes, not a consequence of shipping the validator, and none
# of the three consumer repositories declares it. A section absent is an answer.

# `md-readme-index` is not declared. It is the weaker half of a rule this
# repository already holds in full: every tree it would name is already a
# `governance-directory-map` tree, which wants the README *and* a map section.
# Declaring both would check the same directories twice and report the weaker
# failure alongside the stronger one.
#
# `md-frontmatter` is not declared. Nothing here carries front matter, and a
# surface that required nothing of files that hold nothing would be a rule
# whose passing says nothing.

# What runs, and when. `rhino gate run --surface <name>` reads this list once and
# runs the gates that name the surface, in the order they are declared here.
#
# Every entry runs the binary this repository builds rather than a released
# archive. RHINO cannot pin a copy of itself: a tool that validated its working
# tree with the last release would pass a change that breaks the very rule the
# change was making, and would have nothing to say about a rule it had just
# added. `cargo run` is a no-op once the binary is current, so the cost is paid
# once per surface and not per gate.
#
# `public-safety` is first on every surface. A gate that screens what leaves the
# repository is worth nothing if a cheaper check ahead of it can pass the change
# through while it is still queued.
gates:
  - id: public-safety
    kind: check
    run:
      - bash
      - scripts/public-safety/check.sh
    surfaces:
      - commit-msg
      - pre-commit
      - pre-push
      - ci

  - id: public-safety-tests
    kind: check
    run:
      - bash
      - scripts/public-safety/tests/run.sh
    surfaces:
      - ci

  - id: commit-message
    kind: check
    run:
      - npm
      - exec
      - --
      - commitlint
      - --edit
    surfaces:
      - commit-msg

  - id: format-staged
    kind: mutation
    run:
      - npm
      - exec
      - --
      - lint-staged
    surfaces:
      - pre-commit

  # The quick gate: `cargo fmt`, Clippy with warnings denied, the unit adapter
  # under a 99% line-coverage floor measured in the same execution, and the
  # static behaviour-coverage check.
  #
  # Before the validators, not after, and that order is inherited rather than
  # chosen: `test-quick` has always run them last so that a repository which is
  # out of date cannot mask a product that is broken. Moving the list out of
  # Rust was not a reason to reverse it.
  #
  # `test-quick` used to end by running the validators itself. It no longer
  # does: they are declared below and dispatched by the surface, and a gate that
  # also ran them would run them twice and report the second failure as a new
  # one.
  - id: quick
    kind: check
    run:
      - ./hippo
      - run
      - --class
      - ephemeral
      - --disk-path
      - .
      - --
      - cargo
      - xtask
      - test-quick
    surfaces:
      - pre-push

  # Ten validators. Nine of them were the `SELF_VALIDATION` array in
  # `xtask/src/main.rs`, unchanged in command, order and invocation -- what moved
  # is where the list lives, from a Rust constant nobody outside this repository
  # can read to the file every other repository declares its gates in.
  #
  # One is new: `governance companions validate`, declared because the governance
  # tree gains ordered companion sets, and a set nothing reads is a set that
  # drifts.
  #
  # `metadata validate`, `governance roots validate` and `governance instructions
  # validate` stay undeclared. Each would enforce a rule this repository has not
  # written down, and a gate added because the command exists fails for a reason
  # nobody chose.
  #
  # They run at `pre-push` and in CI rather than at `pre-commit`. Each walks the
  # whole tree, and a rule this repository broke is a rule it broke whether or
  # not this particular commit is the one that broke it; paying ten tree walks
  # per commit would buy nothing that is not already paid before anything leaves
  # the machine.

  - id: repo-config
    kind: check
    run:
      - cargo
      - run
      - --quiet
      - --bin
      - rhino
      - --
      - repo-config
      - validate
    surfaces:
      - pre-push
      - ci

  - id: word-budget
    kind: check
    run:
      - cargo
      - run
      - --quiet
      - --bin
      - rhino
      - --
      - governance
      - word-budget
      - validate
    surfaces:
      - pre-push
      - ci

  - id: directory-map
    kind: check
    run:
      - cargo
      - run
      - --quiet
      - --bin
      - rhino
      - --
      - governance
      - directory-map
      - validate
    surfaces:
      - pre-push
      - ci

  - id: companions
    kind: check
    run:
      - cargo
      - run
      - --quiet
      - --bin
      - rhino
      - --
      - governance
      - companions
      - validate
    surfaces:
      - pre-push
      - ci

  - id: internal-link
    kind: check
    run:
      - cargo
      - run
      - --quiet
      - --bin
      - rhino
      - --
      - md
      - internal-link
      - validate
    surfaces:
      - pre-push
      - ci

  - id: mermaid
    kind: check
    run:
      - cargo
      - run
      - --quiet
      - --bin
      - rhino
      - --
      - md
      - mermaid
      - validate
    surfaces:
      - pre-push
      - ci

  - id: md-naming
    kind: check
    run:
      - cargo
      - run
      - --quiet
      - --bin
      - rhino
      - --
      - md
      - naming
      - validate
    surfaces:
      - pre-push
      - ci

  - id: heading-hierarchy
    kind: check
    run:
      - cargo
      - run
      - --quiet
      - --bin
      - rhino
      - --
      - md
      - heading-hierarchy
      - validate
    surfaces:
      - pre-push
      - ci

  - id: convention-emoji
    kind: check
    run:
      - cargo
      - run
      - --quiet
      - --bin
      - rhino
      - --
      - convention
      - emoji
      - validate
    surfaces:
      - pre-push
      - ci

  - id: harness-parity
    kind: check
    run:
      - cargo
      - run
      - --quiet
      - --bin
      - rhino
      - --
      - harness
      - parity
      - validate
    surfaces:
      - pre-push
      - ci

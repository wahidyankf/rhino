# schema: rhino/repo-config/v1
#
# RHINO's own policy, and the first repository other than the one the
# validators grew up in to be described by this schema. Every value here is a
# choice this repository made; the tool ships none of them.

governance-word-budget:
  # A word is a run of letters and digits, so Markdown syntax counts for
  # nothing and a URL counts as its parts.
  count: letters-and-digits
  # Ordered: the last matching glob wins, so a specific surface can override a
  # general tree.
  surfaces:
    # AGENTS.md is an index into repo-governance and states no rule of its own,
    # so it is budgeted as an index. Going over means a rule was written here
    # instead of in the tree.
    - glob: "AGENTS.md"
      fail: 650
      warn: 550
    - glob: "README.md"
      fail: 1600
      warn: 1400
    # The governance tree. 750 is a ceiling, not a target: a document that
    # outgrows it is split into documents with distinct reader tasks, and the
    # number is never raised to fit one.
    - glob: "repo-governance/**/*.md"
      fail: 750
      warn: 650

governance-directory-map:
  trees:
    - path: docs
    - path: repo-governance
    - path: specs

md-internal-link:
  exclude-sources: []

md-mermaid:
  node-label-graphemes: 32
  edge-label-graphemes: 24
  # Okabe-Ito, which stays distinguishable under the common colour vision
  # deficiencies. A diagram that only works in full colour is a diagram some
  # readers cannot read.
  fill-colors: ["#0173B2", "#DE8F05", "#029E73", "#CA9161"]
  edge-colors: ["#0173B2", "#000000"]
  text-colors: ["#000000", "#FFFFFF"]

harness-parity:
  canonical:
    instruction: AGENTS.md
    instruction-adapter: CLAUDE.md
    skills-root: .agents/skills
    skill-route: "Read {path} completely, resolve every relative resource from that skill directory, and follow it as authoritative before acting."
    agents-root: .agents/agents
    agent-route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
    # The names are this repository's own. A list read under a name nobody
    # wrote comes back empty rather than missing, so a validator that chose
    # these itself would find no capabilities, fire no translation, and report
    # a clean repository -- the one kind of defect a gate cannot survive.
    declaration:
      grants: requires
      denials: denies
      limits: constraints
      fixed: { mode: subagent }
  harnesses:
    # Codex and OpenCode both read `.agents/skills/` natively, so the canon is
    # already their surface and a skill adapter would be a second copy of a
    # file they were going to read anyway. Claude Code reads only
    # `.claude/skills/`, so it is the one harness that needs a route. That
    # asymmetry is the honest declaration; the schema permits it, and the
    # alternative -- an adapter pointing at a directory the vendor does not
    # read -- would be a parity claim that reconciles nothing.
    - name: claude
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        identity: { name: name, description: description }
        # A wrapper declares its identity and the route. Nothing else: an
        # adapter that could add front matter could add an instruction.
        closed: true
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        identity: { name: name, description: description }
        translations:
          - { when: always, field: tools, members: [Read] }
          - {
              when: requires,
              capability: repository-read,
              field: tools,
              members: [Glob, Grep],
            }
          - {
              when: denies,
              capability: repository-write,
              field: tools,
              absent-members: [Write, Edit],
            }
          - {
              when: denies,
              capability: shell,
              field: tools,
              absent-members: [Bash, PowerShell],
            }
          - {
              when: denies,
              capability: nested-agent,
              field: tools,
              absent-members: [Agent, Task],
            }
    - name: codex
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        identity: { name: name, description: description }
        # The sandbox is fixed rather than translated: Codex expresses the
        # whole read-only boundary in one field, and a portable adapter may
        # not pin a model.
        fixed: { sandbox_mode: read-only }
        absent: [model]
    - name: opencode
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        identity: { description: description }
        fixed: { mode: subagent }
        translations:
          - { when: always, field: permission, entries: { read: allow } }
          - {
              when: requires,
              capability: repository-read,
              field: permission,
              entries: { glob: allow, grep: allow },
            }
          - {
              when: denies,
              capability: repository-write,
              field: permission,
              entries: { edit: deny },
            }
          - {
              when: denies,
              capability: shell,
              field: permission,
              entries: { bash: deny },
            }
          - {
              when: denies,
              capability: nested-agent,
              field: permission,
              entries: { task: deny },
            }
  # No `required-mcp` and no per-harness `capability`. This repository uses no
  # workspace task runner and needs no credential-free capability vector, and
  # the schema treats that absence as an answer rather than an omission.
  prohibited-instruction-sources:
    - "**/AGENTS.md"
    - "**/AGENTS.override.md"
    - "**/CLAUDE.md"
    - ".claude/rules/**/*.md"
    - "**/GEMINI.md"
    - "**/.cursorrules"
    - "**/.windsurfrules"
    - ".github/copilot-instructions.md"
  # A competing always-on instruction written into a harness's own settings is
  # the same violation as a second CLAUDE.md, in the vendor's syntax. Only
  # OpenCode's key is declared: Codex's equivalent was not established by
  # inspection, and a prohibition naming a key nobody confirmed would claim
  # coverage it does not have.
  prohibited-instruction-fields:
    - file: opencode.json
      format: json
      field: instructions
  capabilities:
    - repository-read
    - repository-write
    - shell
    - nested-agent
  constraints:
    - inline-result-only

scan:
  # Directory names, matched at any depth. `worktrees` and `local-tmp` are not
  # optional conveniences: RHINO walks the filesystem rather than the index, so
  # a git-ignored directory is still read. An in-repository worktree is a whole
  # second copy of this tree, and leaving it in doubles every counted document,
  # every resolved link and every mapped directory -- and reports the copy's own
  # CLAUDE.md as a second always-on instruction source.
  exclude-directories:
    - .git
    - node_modules
    - target
    - local-tmp
    - worktrees

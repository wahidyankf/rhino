name: PR Quality Gate

# Integration moved to worktree-to-pull-request, so the guarantees that used to
# rest on this workstation's Git hooks need a server-side mirror: a pull request
# can be opened from any checkout, including one whose hooks never ran.
#
# This workflow replaces `ci.yml` rather than sitting beside it. Two workflows
# would mean two places to edit when a hook contract changes, and one of them
# would eventually be missed. Everything the retired workflow ran is here.
#
# The gates themselves come only from the registry in `repo-config.yml`. The
# pull-request surface is split into parallel per-level jobs, and each names
# its registry entries with `--entry`; together they cover every declared
# pull-request gate, and the hooks replay the same declaration (C1). No job
# copies a registry gate's command. The other jobs hold only what the registry cannot
# carry: the pull-request title and body and the branch name (public safety),
# and the pinned HIPPO bootstrap with its path routing, which is documented as
# a workflow-only check in the gate inventory.
#
# Compute runs under HIPPO, as AGENTS.md requires for every local compute path:
# each registry gate that runs a suite carries its own HIPPO guard, and the RHINO
# build below is wrapped the same way.
#
# Every action reference names a full commit SHA, with the release tag it was
# resolved from in a trailing comment. The version of each runtime and tool is recorded
# with its source in phase-2-rhino-workflow-versions.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-safety:
    name: Public safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The pull request head, not the synthetic merge commit: the tree that
      # would be published is the tree that has to be screened.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # This is the repository's own wrapper, and it is the one gate here that
      # runs before every other job's output exists. Its bootstrap verifies the
      # pinned scanner against an approved digest and proves detection and
      # non-disclosure with a credential generated on the runner, so a scanner
      # that silently stopped working fails the job rather than passing it.
      - name: Screen the tracked baseline
        run: ./scripts/public-safety/public-safety.sh --surface baseline

      - name: Screen the branch name
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: ./scripts/public-safety/public-safety.sh --surface ref --text "${HEAD_REF}"

      # Title and body are outbound text on a public service. They are passed
      # through the environment rather than interpolated into the command, so a
      # pull request cannot write shell. Only this job can read them: the
      # registry has no input for event text.
      - name: Screen the pull request text
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ./scripts/public-safety/public-safety.sh --surface pull-request \
            --text "${PR_TITLE}" --text "${PR_BODY}"

  # The pull-request surface runs as three parallel jobs, one per level. Each
  # job names its registry entries with `--entry`, so no job copies a gate's
  # command, and every pull-request entry runs in exactly one of them.
  test-quick:
    name: Test quick
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The head is checked out with its history, because the gate reads the
      # explicit base and head range from the commits themselves.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Node 24 is pinned to the resolved patch release, not the major line, so
      # a runner's cached image cannot move the formatter or the test runner.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.3"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install the pinned toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      # The binary is built here and called directly, rather than through
      # `go run`. The launcher gives every declared child RHINO_GATE_SURFACE,
      # so the surface reaches each child through the environment.
      - name: Build RHINO
        run: |
          ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
            go build -o "${RUNNER_TEMP}/rhino" ./cmd/rhino

      - name: Run the quick gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:${PATH}"
          "${RUNNER_TEMP}/rhino" gate run --surface pull-request --entry quick \
            --base "${BASE_SHA}" --head "${HEAD_SHA}"

  test-integration:
    name: Test integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.3"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install the pinned toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build RHINO
        run: |
          ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
            go build -o "${RUNNER_TEMP}/rhino" ./cmd/rhino

      - name: Run the integration target
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:${PATH}"
          "${RUNNER_TEMP}/rhino" gate run --surface pull-request --entry test-integration \
            --base "${BASE_SHA}" --head "${HEAD_SHA}"

  # Every other pull-request entry: the document and repository checks, the
  # commit-message and history checks, the leak screens, and the verify-clean
  # replay of each formatter. node_modules/.bin goes first on PATH, as the local
  # hooks put it there, so the formatter the job calls is the pinned one.
  pull-request-checks:
    name: Pull-request checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.3"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install the pinned toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build RHINO
        run: |
          ./hippo run --class ephemeral --resource-tier standard --disk-path . -- \
            go build -o "${RUNNER_TEMP}/rhino" ./cmd/rhino

      - name: Run the pull-request checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:${PATH}"
          "${RUNNER_TEMP}/rhino" gate run --surface pull-request \
            --entry public-safety-tree --entry public-safety-range --entry public-safety-message \
            --entry remote-dispatch-refusal --entry commit-message --entry commit-history \
            --entry format-staged --entry public-safety-tests --entry repo-config \
            --entry word-budget --entry directory-map --entry quality-gates \
            --entry harness-adapters --entry check-hippo-consumer-tests \
            --entry internal-link --entry mermaid \
            --entry markdown-line-length --entry md-naming --entry heading-hierarchy \
            --entry convention-emoji \
            --base "${BASE_SHA}" --head "${HEAD_SHA}"

  consumer-bootstrap:
    name: Pinned HIPPO bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # Narrower than the rest of the gate on purpose: an ordinary pull request
      # pays nothing for a consumer boundary it did not touch.
      - name: Route on the pinned consumer boundary
        id: route
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          git fetch --no-tags origin "${BASE_REF}"
          changed=$(git diff --name-only FETCH_HEAD...HEAD -- \
            hippo hippo.lock hippo.identity.json hippo.local.json.example scripts/check-hippo-consumer.sh scripts/public-safety \
            '.github/workflows/pr-quality-gate.yml')
          if [ -n "${changed}" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      # Pinned to the version this workstation runs. The runner image ships an
      # older ShellCheck that still emits SC2015 for `A && B || C`, an idiom
      # this wrapper uses correctly at lines 177 and 270 -- a gate that fails on
      # linter drift rather than on the code would train its readers to ignore
      # it. Checksum-verified, because an unverified download in a gate is a
      # supply chain this repository did not choose.
      - name: Install the pinned ShellCheck
        if: steps.route.outputs.changed == 'true'
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_LINUX_X86_64_SHA512: "25df28923d7d89cfdb9fa8aeef762a887f2bd4ebfbcd43ae71068c60e9458d66250b0f8d6fd66b4bc03723e6cdd47983c547e3ab4f3ea2cbc4bc4028842cc7b9"
        run: |
          set -eu
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --fail --location --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "${archive}"
          printf '%s  %s\n' "${SHELLCHECK_LINUX_X86_64_SHA512}" "${archive}" | sha512sum --check --strict
          tar --extract --xz --file "${archive}" --directory "${RUNNER_TEMP}" \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          # A dedicated directory, not RUNNER_TEMP itself: prepending the whole
          # scratch directory to PATH would make every file dropped there by any
          # step resolvable as a command.
          mkdir -p "${RUNNER_TEMP}/pinned-bin"
          install -m 0755 "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "${RUNNER_TEMP}/pinned-bin/shellcheck"
          printf '%s\n' "${RUNNER_TEMP}/pinned-bin" >> "${GITHUB_PATH}"

      # This wrapper is repository-owned rather than a vendored upstream file,
      # and no other gate reads it. It is also the only surface here that runs
      # on a clean machine, which is the condition a local hook cannot observe.
      - name: Lint the wrappers
        if: steps.route.outputs.changed == 'true'
        run: |
          shellcheck --version
          shellcheck hippo
          shellcheck scripts/public-safety/public-safety.sh
          shellcheck scripts/public-safety/tests/run.sh
          shellcheck --shell=bash scripts/public-safety/tests/cases/*.sh

      - name: Verify the pinned bootstrap resolves and verifies
        if: steps.route.outputs.changed == 'true'
        run: ./hippo run --class ephemeral --resource-tier light --disk-path . -- true

      - name: Verify the HIPPO consumer policy
        if: steps.route.outputs.changed == 'true'
        run: npm run check:hippo-consumer

  quality-gate:
    name: Quality gate
    # The single required status check. Individual jobs may legitimately skip,
    # and a skipped required check never reports at all, so merge protection
    # points at this aggregate rather than at each job.
    needs:
      [
        public-safety,
        test-quick,
        test-integration,
        pull-request-checks,
        consumer-bootstrap,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every gate
        env:
          # A cancelled or skipped dependency is not a pass: only an explicit
          # success from every job may open the merge button.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -eu
          echo "Gate results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "A quality gate job did not succeed." >&2
              exit 1
            fi
          done
          echo "All quality gates passed."

# The daily re-run of the quick gate, kept out of every Git hook on purpose:
# even a fast suite trains a maintainer into bypassing the hook that runs it
# when the machine is busy.
#
# A failure here means the main line drifted red outside any pull request.
name: Scheduled

on:
  schedule:
    # Daily, well outside the working day in the maintainer's timezone.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily-quick-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Quick gate, unfiltered
        # No name filter, no skips, nothing selected by hand.
        # A scheduled run that quietly narrowed itself would report a green
        # suite for a subset nobody chose.
        run: ./scripts/test-quick.sh

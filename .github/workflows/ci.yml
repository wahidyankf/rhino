name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Coverage tooling
        # The quick gate measures unit coverage in the same execution that runs
        # the unit adapter, so the gate cannot run without this.
        run: cargo install --locked cargo-llvm-cov
      - name: Supply chain
        run: |
          cargo install --locked cargo-deny
          cargo deny check
      - name: Quick gate
        run: cargo xtask test-quick

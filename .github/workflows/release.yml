# A release is what a consumer pins, so this workflow's job is to make the
# published artifacts checkable rather than merely present.
#
# Four properties it holds, none of which a build alone gives you:
#
#   1. The tag names a commit on `main`. A release that described a commit
#      reachable from nowhere would still install and run, and nobody could say
#      what it contained.
#   2. Every archive was assembled from a clean checkout of exactly the tagged
#      commit. Go cross-compiles all four platform binaries from one runner, so
#      one job builds the whole set instead of a matrix leg per platform, and
#      `scripts/build-release.sh` refuses a dirty checkout or a commit that is
#      not HEAD before it writes anything.
#   3. Nothing is published until the assembled set verifies as a set. The
#      artifact suite runs twice: once per leg on its own archive, and once more
#      on all four together, where the four-platform assertion becomes total.
#   4. The tagged commit has a passing Main Test run on both operating systems,
#      so a tag never ships a commit whose full gate failed or never ran.
#
# `gh release create` fails when the release already exists, so a re-run cannot
# replace a published tag. That is the immutability rule enforced rather than
# written down.
name: Release

on:
  push:
    tags:
      - "v*"

# Never cancelled. A half-published release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Reads the Main Test run history for the tagged commit below.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # The ancestry test needs history; the default shallow fetch has none.
          fetch-depth: 0

      - name: The tag names a commit on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          # Peeled, so an annotated tag is compared by the commit it points at
          # rather than by the tag object's own hash.
          tag_commit=$(git rev-parse "$GITHUB_REF_NAME^{}")
          test "$tag_commit" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$tag_commit" origin/main

      # The full gate runs after merge, so a commit can reach main before its
      # test run has passed. A tag is permanent: refuse to build or publish until
      # that run passes, and re-run this workflow once it does. A failed Main Test
      # run is fixed forward or reverted, and the tag is cut again from the fix.
      - name: Require a passing Main Test run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/main-test.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')
          if [ "${passed}" -lt 1 ]; then
            echo "No passing Main Test run exists for ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: The tag names a releasable version
        run: |
          # A prerelease is a prerelease *of* a version, so `v0.1.0-rc.1` is
          # built as `v0.1.0`. The Go module carries no version manifest: the
          # tag is the version, stamped into the binary at build time, and the
          # artifact check below asks the built executable to prove it.
          # This check fails fast on a malformed tag instead of after the build.
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*-*) ;;
            *) echo "tag must be v<semver>, with an optional suffix" >&2; exit 1 ;;
          esac

  build:
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Assemble all four platform archives
        # One runner cross-compiles the whole set; the script refuses anything
        # but a clean checkout of the tagged commit, and writes the digest
        # file beside the archives.
        run: scripts/build-release.sh "${GITHUB_REF_NAME%%-*}" "${GITHUB_SHA}" dist

      - name: The set is complete
        run: |
          set -eu
          ls dist/rhino-*.tar.gz
          test "$(ls dist/rhino-*.tar.gz | wc -l)" = 4
          cat dist/checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rhino-archives
          path: |
            dist/rhino-*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          # The publish job downloads these within the same run; nothing reads
          # them afterwards.
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rhino-archives
          merge-multiple: true

      - name: Stage the checked-in grouped schema
        # There is no schema generator in the Go tree: the checked-in Draft
        # 2020-12 artifact is the source of truth, staged here under the
        # release asset name.
        run: cp schemas/repo-config/v2.schema.json dist/rhino-repo-config-v2.schema.json

      - name: Unpack the host archive
        # So the identity assertion runs the executable out of a published
        # archive rather than a copy staged beside it. This runner is `x86_64`
        # Linux, so that is the leg it can execute.
        run: tar -xzf dist/rhino-x86_64-unknown-linux-gnu.tar.gz -C dist

      - name: Verify the assembled release
        # Here, and only here, a missing platform is a failure rather than a
        # note: this job is the one that would otherwise publish three
        # archives as four. The digest file the build wrote covers every
        # archive; the unpacked executable proves its stamped identity.
        run: |
          set -eu
          test "$(ls dist/rhino-*.tar.gz | wc -l)" = 4
          (cd dist && sha256sum -c checksums.txt)
          test "$(./dist/rhino version)" = "${GITHUB_REF_NAME%%-*}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag carrying a suffix is a prerelease of the version before it,
          # and is marked as one so nobody pins a rehearsal by accident.
          case "$GITHUB_REF_NAME" in
            *-*) marking=--prerelease ;;
            *) marking= ;;
          esac
          release_notes=(--generate-notes)
          # v0.4.0 follows the rehearsal tags, but it is the next stable
          # release after v0.3.0. Keep its published comparison anchored to
          # the prior stable release rather than to an RC.
          if [[ "$GITHUB_REF_NAME" == "v0.4.0" ]]; then
            release_notes+=(--notes-start-tag v0.3.0)
          elif [[ "$GITHUB_REF_NAME" == "v0.12.0" ]]; then
            release_notes+=(--notes-start-tag v0.11.0)
          elif [[ "$GITHUB_REF_NAME" == "v0.13.0" ]]; then
            release_notes+=(--notes-start-tag v0.12.0)
          fi
          # Only the four archives, grouped schema, and digest file. `dist/`
          # also holds the executable unpacked above, which is not a release
          # asset.
          gh release create "$GITHUB_REF_NAME" \
            dist/rhino-*.tar.gz dist/rhino-repo-config-v2.schema.json dist/checksums.txt \
            --verify-tag \
            "${release_notes[@]}" \
            --title "$GITHUB_REF_NAME" \
            $marking

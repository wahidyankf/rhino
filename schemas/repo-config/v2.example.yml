# yaml-language-server: $schema=./v2.schema.json
schema: rhino/repo-config/v2
repository: {}
scan: {}
harness: {}
policies:
  markdown: {}
  governance:
    quality-gates:
      root: repo-governance/workflows
      agents: .agents/agents
      groups: [plan, quality, maintenance]
      gate-group: quality
      gate-headings:
        - Entry
        - Inputs
        - Deterministic Boundary
        - Cycle
        - Termination
        - Verdict
        - Ledger
      verdict-heading: Verdict
      verdicts: [PASS, PASS_WITH_FINDINGS, FAIL, BLOCKED]
      retired-inputs: [max-iterations, min-iterations, max-audits]
      propagation-headings:
        - Contract
        - Scope
        - Executor
        - Row Verification
        - Family Rules
      defaults:
        mode: normal
        max-cycles: 3
      gates:
        - family: plan
        - family: docs
  conventions: {}
  plans: {}
environment: {}
toolchains: {}
gates:
  entries:
    - id: format-files
      type: mutation
      inputs:
        files: { kind: regular-files }
      mutation:
        local: apply-index
        ci: verify-clean
      command:
        executable: formatter
        args:
          - { input: files.paths, expand: repeat }
      run-on:
        pre-commit:
          bind:
            files: { source: git-index }
        pull-request:
          bind:
            files: { source: explicit-range, range: explicit }
  composition:
    pull-request:
      relation: exact
extensions: {}

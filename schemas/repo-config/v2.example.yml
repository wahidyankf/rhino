# yaml-language-server: $schema=./v2.schema.json
schema: rhino/repo-config/v2
repository: {}
scan: {}
harness: {}
policies:
  markdown: {}
  governance:
    quality-gates:
      root: repo-governance/workflows
      agents: .agents/agents
      groups: [plan, quality, maintenance]
      gate-group: quality
      gate-headings:
        - Entry
        - Inputs
        - Deterministic Boundary
        - Cycle
        - Termination
        - Verdict
        - Ledger
      verdict-heading: Verdict
      verdicts: [PASS, PASS_WITH_FINDINGS, FAIL, BLOCKED]
      retired-inputs: [max-iterations, min-iterations, max-audits]
      propagation-headings:
        - Contract
        - Scope
        - Executor
        - Row Verification
        - Family Rules
      defaults:
        mode: normal
        max-cycles: 3
      gates:
        - family: plan
        - family: docs
  conventions: {}
  plans: {}
environment:
  vault:
    provider: bitwarden
    server: https://vault.example.com
    prefix: org/example-repo
    environments: [local, stag, canary, prod]
    patterns:
      - "**/.env*"
      - "**/*.tfvars"
    entries:
      - path: infra/example/.env.prod
        class: vault
        form: env
        app: infra-example
        env: prod
        keys:
          - TAILSCALE_AUTH_KEY
          - { key: CLOUDFLARE_API_TOKEN, app: infra-edge, secret: edge-dns }
          - { key: EXAMPLE_TOKEN, app: infra-example, secret: example-token }
      - path: infra/example/terraform/terraform.tfvars
        class: vault
        form: file
        app: infra-terraform
        env: prod
        secret: tfvars
      - path: infra/example/ansible/inventory.ini
        class: derived
        reason: Rendered by the infrastructure stack from VM addresses.
        by: infra/example/terraform/outputs.tf
    templates:
      - path: infra/example/ansible/.env.example
        for: infra/example/.env.prod
    github:
      workflows: [".github/workflows/*.yml"]
      builtin: [GITHUB_TOKEN]
      secrets:
        - name: EXAMPLE_TOKEN
          source: { app: infra-example, env: prod, secret: example-token }
toolchains: {}
gates:
  entries:
    - id: format-files
      type: mutation
      inputs:
        files: { kind: regular-files }
      mutation:
        local: apply-index
        ci: verify-clean
      command:
        executable: formatter
        args:
          - { input: files.paths, expand: repeat }
      run-on:
        pre-commit:
          bind:
            files: { source: git-index }
        pull-request:
          bind:
            files: { source: explicit-range, range: explicit }
  composition:
    pull-request:
      relation: exact
extensions: {}

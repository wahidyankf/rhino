[package]
name = "rhino"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Repository Hygiene & INtegration Orchestrator — a configuration-driven repository-hygiene validator"
license = "MIT"
repository = "https://github.com/wahidyankf/rhino"
readme = "README.md"
keywords = ["governance", "linter", "markdown", "documentation", "repository"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = ["xtask"]

[[bin]]
name = "rhino"
path = "src/main.rs"

[lib]
name = "rhino"
path = "src/lib.rs"

[dependencies]
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"

[dev-dependencies]
unicode-segmentation = "1"

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "coverage"
path = "tests/coverage/main.rs"

# Size-optimized release profile. Every choice here is measured in Phase 6 of
# the extraction plan and recorded against a budget; none is applied on faith.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
